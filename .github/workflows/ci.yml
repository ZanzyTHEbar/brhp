name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: pnpm install

      - name: TypeScript typecheck
        run: pnpm typecheck

      - name: Unit and integration tests
        run: pnpm test

      - name: SQL compile and vet
        run: pnpm db:compile && pnpm db:vet

      - name: Build distribution
        run: pnpm build

      - name: Package verification smoke
        run: pnpm verify:package
